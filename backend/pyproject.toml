[project]
name = "insighting-analytics-backend"
version = "0.2.0"
description = "Chat with PostgreSQL databases using natural language — Ollama + PandasAI"
requires-python = ">=3.9,<3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # PandasAI
    "pandasai>=2.0",
    # Database drivers
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "pyodbc>=5.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.7",
    # LLM (Ollama — FOSS)
    "httpx>=0.27",
    # Data / stats
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.14",
    "statsmodels>=0.14",
    # Settings
    "pydantic-settings>=2.4",
    # Caching
    "cachetools>=5.4",
    # Scheduling
    "apscheduler>=3.10,<4",
    # Encryption
    "cryptography>=43",
    # Export
    "reportlab>=4.2",
    # Misc
    "python-dotenv>=1.0",
    # Security
    "simpleeval>=0.9",
    "slowapi>=0.1",
    "python-magic>=0.4",
    # Authentication
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.1",
    # Alert connectors
    "paramiko>=3.4",
    # SQL parsing
    "sqlparse>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
